services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CATO_FAKE_LLM: "${CATO_FAKE_LLM:-0}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      CATO_LLM_MODEL: "${CATO_LLM_MODEL:-gpt-4o-mini}"
      CATO_LLM_SPECIALIST_MODEL: "${CATO_LLM_SPECIALIST_MODEL:-gpt-4o-mini}"
      CATO_LLM_STRATEGY_MODEL: "${CATO_LLM_STRATEGY_MODEL:-gpt-4o-mini}"
      CATO_QDRANT_PATH: /app/artifacts/qdrant
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:5173"
