[project]
name = "cato-deal-intel"
version = "0.1.0"
description = "A small, auditable deal intelligence CLI prototype."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.10,<3",
    "typer>=0.15,<1",
    "qdrant-client>=1.12,<2",
    "openai>=1.60,<2",
    "python-dotenv>=1.0,<2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cato_deal_intel*"]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
]

[project.scripts]
deal-intel = "cato_deal_intel.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_llm: requires a configured live LLM provider",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true
