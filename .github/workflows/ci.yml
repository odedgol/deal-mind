name: Test Verification

on:
  push:
    branches: ["master", "main", "home-task"]
  pull_request:
    branches: ["master", "main"]

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks and E2E
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy cato_deal_intel

      - name: Unit and integration tests
        env:
          CATO_FAKE_LLM: "1"
        run: uv run pytest -q -m "not live_llm"

      - name: End-to-end API journey
        env:
          CATO_FAKE_LLM: "1"
        run: uv run pytest -q tests/e2e -m e2e

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
